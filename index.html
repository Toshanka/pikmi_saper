<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Сапёр | Тёплые слова</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <div>
        <p class="eyebrow">МИНИ-ИГРА ДЛЯ ТВОЕГО БОТА</p>
        <h1>Сапёр <span>♥</span></h1>
        <p class="subtitle">Открывай клетки осторожно. Сегодня удача на твоей стороне.</p>
      </div>
      <div class="hero-mark" aria-hidden="true">✦</div>
    </header>

    <section class="game-panel" aria-label="Игра Сапёр">
      <div class="stats-row">
        <div class="stat"><span>МИНЫ</span><strong id="mine-count">10</strong></div>
        <div class="stat timer-stat"><span>ВРЕМЯ</span><strong id="timer">000</strong></div>
        <button class="face-button" id="new-game" type="button" aria-label="Начать новую игру">☺</button>
      </div>

      <div class="status-line" id="status" role="status">Найди безопасный путь к победе</div>
      <div class="board" id="board" role="grid" aria-label="Игровое поле сапёра"></div>

      <div class="controls">
        <button class="control-button secondary" id="flag-mode" type="button" aria-pressed="false">⚑ Режим флага</button>
        <button class="control-button primary" id="send-result" type="button" disabled>Отправить результат</button>
      </div>
      <p class="hint">Нажми на клетку, чтобы открыть её. На телефоне можно включить режим флага.</p>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
